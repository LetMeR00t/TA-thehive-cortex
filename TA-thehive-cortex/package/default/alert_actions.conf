python.required = 3.9, 3.13
description = This action allows to run a function defined in TheHive - A specific licence is required for this
label = TheHive - Run a function
param._cam = {"technology": [{"product": "TheHive", "version": ["5.6"], "vendor": "StrangeBee"}], "supports_adhoc": true, "task": ["remediate"], "category": ["Remediation"], "subject": ["threat.artifact"]}     
is_custom = 1
payload_format = json
icon_path = thehive_run_function.png
param.thehive_instance_id = <default>
# The form posts `name` and the code reads `name` (run_function_helper.py:57).
# The declaration said `title`, which nothing reads: the declared parameter did
# not exist and the one that exists was not declared.
param.name =

