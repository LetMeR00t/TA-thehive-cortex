[cortex_run_a_new_job]
python.version = python3
python.required = 3.9, 3.13
description = This action allows to run a new job in Cortex
label = Cortex - Run a new job
param._cam = {"technology": [{"vendor": "StrangeBee", "product": "Cortex", "version": ["2.x"]}], "supports_adhoc": true, "category": ["Information Gathering"], "task": ["scan"], "subject": ["threat.artifact"]}
is_custom = 1
payload_format = json
icon_path = cortex_run_a_new_job.png
param.data_field_name = data
param.datatype_field_name = datatype
param.tlp = 3
param.pap = 3
# Both are read by modalert_cortex_run_a_new_job_helper.py and were declared
# nowhere. `analyzers` is marked required in the form: when empty, the code
# reached cortex.py and called .replace() on None -- an AttributeError instead
# of a message naming the missing field.
param.cortex_instance_id = <default>
param.analyzers = all

