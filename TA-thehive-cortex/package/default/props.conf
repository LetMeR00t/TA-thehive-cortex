# --- Logs written by the add-on itself ---------------------------------------
#
# Two naming schemes coexist, and that is the whole reason this file rotted:
#   * search commands go through ta_logging.setup_logging(), which builds
#     "TA-thehive-cortex_<name>.log";
#   * alert actions go through solnlib's Logs().get_logger(), which sets no
#     namespace here, so the file is plainly "<alert>_modalert.log".
#
# Until v4.2.2 this section ENUMERATED the v3.x command names. The rename in
# v4.0.0 left every search command without a sourcetype, and nobody noticed:
# the *_modalert stanzas kept matching, so the file still looked alive.
# Matching the shape of the name instead of listing today's commands is what
# stops that from happening again -- and
# tools/checks/log_sourcetype_covered.py now refuses any name no stanza covers.

[source::...TA-thehive-cortex_*.log*]
sourcetype = tathehivecortex:log

# Deliberately NOT "..._modalert.log*": that would relabel the alert action
# logs of every other add-on installed on the instance.
[source::...thehive_*_modalert.log*]
sourcetype = tathehivecortex:log

[source::...cortex_*_modalert.log*]
sourcetype = tathehivecortex:log

# Kept for data indexed by v3.x, whose files carried the old naming.
[source::...command_thehive_*.log*]
sourcetype = tathehivecortex:log

# The sourcetype all of the above assign, and that nothing defined until now:
# it inherited Splunk's defaults for line breaking and timestamping, on a
# format that starts with an ISO date and is perfectly describable.
# ta_logging.py formats with "%(asctime)s ...", i.e. "2026-08-19 21:39:02,123".
[tathehivecortex:log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} )
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
category = Application
description = Command and alert action logs of TA-thehive-cortex
pulldown_type = 1

[thehive:cases:createdAt]
BREAK_ONLY_BEFORE = (^\{)
LINE_BREAKER = (^\{)
INDEXED_EXTRACTIONS = JSON
KV_MODE=none
TIMESTAMP_FIELDS = time
MAX_TIMESTAMP_LOOKAHEAD = 0
NO_BINARY_CHECK = true
SHOULD_LINEMERGE = false
category = Structured
description = A variant of the JSON source type for the TheHive Cortex app
pulldown_type = 1

