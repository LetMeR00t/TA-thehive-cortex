# Search macros — the single entry point of every search this add-on ships.
#
# ⚠️ NONE of these macros names an index, and that is deliberate: which index
# holds TheHive data differs from one deployment to the next. Adding `index=…`
# here is the administrator's decision, made once, and every dashboard follows.
#
#   [thehive_cases]
#   definition = index=my_soc_index sourcetype="thehive:cases:*" OR …
#
# The alternative — an index written into each panel — means editing the views
# on every upgrade, which is how local edits get lost.

[thehive_cases]
definition = sourcetype="thehive:last_created:cases" OR sourcetype="thehive:last_updated:cases" OR sourcetype="thehive:cases:*"
description = Macro to search across all legacy and new TheHive Cases sourcetypes

[thehive_alerts]
definition = sourcetype="thehive:last_created:alerts" OR sourcetype="thehive:last_updated:alerts" OR sourcetype="thehive:alerts:*"
description = Macro to search across all legacy and new TheHive Alerts sourcetypes

[thehive_observables]
definition = sourcetype="thehive:last_created:observables" OR sourcetype="thehive:last_updated:observables" OR sourcetype="thehive:observables:*"
description = Macro to search across all legacy and new TheHive Observables sourcetypes

[thehive_audit]
definition = sourcetype="thehive:last_created:audit" OR sourcetype="thehive:audit"
description = Macro to search across all legacy and new TheHive Audit sourcetypes

# ⚠️ `thehive:cases:tasks:*` was missing until 4.2.3. props.conf defines
# thehive:cases:tasks:createdAt, :updatedAt and :startDate, and the modular
# input writes them — so a search built on this macro silently skipped every
# task collected per case. The gap was invisible: the macro returned results,
# just not all of them.
[thehive_tasks]
definition = sourcetype="thehive:last_created:case_tasks" OR sourcetype="thehive:last_updated:case_tasks" OR sourcetype="thehive:tasks:*" OR sourcetype="thehive:cases:tasks:*"
description = Macro to search across all legacy and new TheHive Tasks sourcetypes

# The add-on's OWN logs: search commands, modular inputs and alert actions.
#
# ⚠️ These land in `_internal`, which is not in the default search indexes of
# every role. If this macro returns nothing while the files exist on disk, add
# `index=_internal` to it — that is exactly the choice this macro exists to
# make once instead of in nine places.
#
# ⚠️ And on an installation upgraded from 4.0.0 to 4.2.2 the sourcetype was
# never assigned: Splunk auto-learned one from the file name instead. See the
# release notes for the one-time purge of etc/apps/learned/local/props.conf.
[thehive_cortex_logs]
definition = sourcetype="tathehivecortex:log"
description = Macro to search the logs this add-on writes — commands, modular inputs and alert actions
